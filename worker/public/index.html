<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Answers from IRS publications, with checked quotes</title>
  <meta name="description" content="A retrieval-augmented answer engine over 11 IRS publications. Every quote is checked word for word against its source before it is shown, or the answer is 'not found'.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* hidden until studio/loader.js has the visitor's layout styled and rendered; the class is set by script, so
       without JavaScript the page shows the noscript text below */
    html.boot body { opacity: 0; }
    body { margin: 0; transition: opacity .2s; }
  </style>
  <!-- the layouts, colour sets and typefaces (window.STUDIO); classic, so it is there before the loader runs -->
  <script src="/presets.js"></script>
  <script>
    // paint the saved (or default) colour set's background right away, so a dark look does not flash white
    (function () {
      var S = window.STUDIO, c = null;
      try { c = JSON.parse(localStorage.getItem("rag-site-choice")); } catch (e) { /* default */ }
      var p = (c && S.PALETTES[c.palette]) || S.PALETTES[S.DEFAULT.palette];
      document.documentElement.style.background = p.bg;
      document.documentElement.classList.add("boot");
      setTimeout(function () { document.documentElement.classList.remove("boot"); }, 6000); // never stay hidden
    })();
  </script>
  <script type="module" src="/studio/loader.js"></script>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <main style="font:16px/1.6 system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 20px">
      <h1>Answers from IRS publications, with checked quotes</h1>
      <p>A retrieval-augmented answer engine over 11 IRS publications: every quote is checked word for word against its source before it is shown, or the answer is "not found". This page needs JavaScript to ask a question.</p>
      <p>The code, the 150-question evaluation and every result are on <a href="https://github.com/mattniznik/rag.irs.mniznik">GitHub</a>. Built by Mat Niznik. Not tax advice.</p>
    </main>
  </noscript>
</body>
</html>
